name: Build Flatpak

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak \
            flatpak-builder \
            elfutils \
            librsvg2-bin

      - name: Add GNOME runtime remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME 50 SDK, runtime and Rust extension
        run: |
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Generate PNG icons from SVG
        run: |
          mkdir -p packaging/icons
          for size in 64 128 256; do
            rsvg-convert -w $size -h $size packaging/manga-translator-gtk.svg \
              -o packaging/icons/com.mangatranslator.gui-${size}x${size}.png
          done
          ls -la packaging/icons/

      - name: Build Flatpak
        run: |
          cd flatpak
          flatpak-builder \
            --user \
            --disable-rofiles-fuse \
            --force-clean \
            --repo=repo \
            build-dir \
            com.mangatranslator.gui.yaml

      - name: Create .flatpak bundle
        run: |
          cd flatpak
          VERSION="${GITHUB_REF_NAME:-0.0.0}"
          # Release tags are named v0.2.2; the asset should read MangaTranslator-0.2.2-…
          VERSION="${VERSION#v}"
          BUNDLE="MangaTranslator-${VERSION}-x86_64.flatpak"
          flatpak build-bundle repo "${BUNDLE}" com.mangatranslator.gui
          mkdir -p ../dist
          mv "${BUNDLE}" ../dist/
          echo "Created ${BUNDLE} ($(du -h ../dist/${BUNDLE} | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: manga-translator-flatpak-x86_64
          path: dist/*.flatpak

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.flatpak
