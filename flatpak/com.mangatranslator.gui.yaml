app-id: com.mangatranslator.gui
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: manga-translator-gtk

# appstreamcli 1.0.6 in the current GNOME 50 SDK loads icons through glycin,
# which refuses to start inside the flatpak-builder sandbox (it spawns its
# loader via flatpak-spawn, and /.flatpak-info of a *build* sandbox has no
# [Application] group). That aborts the cleanup phase with "E: file-read-error".
# The metainfo and icons are still installed; only the pre-composed catalogue
# in share/app-info is skipped.
appstream-compose: false

# GNOME 50 is based on freedesktop-sdk 25.08, so the matching Rust extension is
# usable here. Building against the SDK (instead of the host) is what guarantees
# that the GTK 4 / libadwaita headers we compile against are the ones that ship
# in the runtime; the host libadwaita on CI images is far older than 1.9.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  # cargo needs to reach crates.io; flatpak-builder's sandbox has no network by default
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/manga-translator-gtk/.cargo-home

# NVIDIA / CUDA driver extension for GPU compute
add-extensions:
  org.freedesktop.Platform.GL:
    directory: lib/GL
    version: "1.4"
    versions: 1.4;1.0
    no-autodownload: true
    autodelete: false
    add-ld-path: lib
    merge-dirs: vulkan/icd.d;glvnd/egl_vendor.d;OpenCL/vendors;lib/dri;lib/d3d;vulkan/explicit_layer.d;vulkan/implicit_layer.d
    download-if: active-gl-driver
    enable-if: active-gl-driver

finish-args:
  # GPU acceleration (all devices for CUDA access)
  - --device=all
  # X11 / Wayland
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Translation APIs (DeepL, OpenRouter, etc.)
  - --share=network
  # Access to manga directories and Python venv
  - --filesystem=home
  # Spawn host processes (Python backend via flatpak-spawn --host)
  - --talk-name=org.freedesktop.Flatpak
  # Theme / matugen colors
  - --filesystem=xdg-config/gtk-4.0:ro
  - --filesystem=xdg-data/themes:ro
  - --filesystem=xdg-data/icons:ro

modules:
  - name: manga-translator-gtk
    buildsystem: simple
    build-commands:
      # Create GL extension directory for NVIDIA driver
      - mkdir -p ${FLATPAK_DEST}/lib/GL

      # Binary, compiled inside the SDK against its GTK 4 / libadwaita
      - cargo build --release --locked
        --manifest-path manga-translator-gtk/Cargo.toml
      - install -Dm755 manga-translator-gtk/target/release/manga-translator-gtk
        ${FLATPAK_DEST}/bin/manga-translator-gtk

      # Desktop file (renamed to app-id for Flatpak convention)
      - install -Dm644 packaging/manga-translator-gtk.desktop
        ${FLATPAK_DEST}/share/applications/com.mangatranslator.gui.desktop
      - sed -i 's|^Icon=.*|Icon=com.mangatranslator.gui|'
        ${FLATPAK_DEST}/share/applications/com.mangatranslator.gui.desktop

      # Icons (renamed to app-id for Flatpak convention).
      # No scalable SVG: flatpak build-export validates icons through
      # libappstream/glycin, and on the build host no SVG image loader is
      # installed, so an SVG icon makes the export fail with
      # "...com.mangatranslator.gui.svg is not a valid icon: Format not recognized".
      - install -Dm644 packaging/icons/com.mangatranslator.gui-64x64.png
        ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps/com.mangatranslator.gui.png
      - install -Dm644 packaging/icons/com.mangatranslator.gui-128x128.png
        ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/com.mangatranslator.gui.png
      - install -Dm644 packaging/icons/com.mangatranslator.gui-256x256.png
        ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/com.mangatranslator.gui.png
      # Update icon theme cache for appstreamcli
      - gtk-update-icon-cache ${FLATPAK_DEST}/share/icons/hicolor || true

      # AppStream metainfo
      - install -Dm644 packaging/metainfo/io.github.manga_translator_gtk.appdata.xml
        ${FLATPAK_DEST}/share/metainfo/com.mangatranslator.gui.metainfo.xml

      # Python backend
      - install -Dm644 manga-translator-gtk/backend/server.py
        ${FLATPAK_DEST}/share/manga-translator-gtk/backend/server.py

      # Locale (.mo files)
      - |
        for po_dir in locale/*/LC_MESSAGES; do
          lang="$(basename "$(dirname "$po_dir")")"
          for mo in "${po_dir}"/*.mo; do
            [ -f "$mo" ] || continue
            install -Dm644 "$mo" \
              ${FLATPAK_DEST}/share/locale/${lang}/LC_MESSAGES/$(basename "$mo")
          done
        done

    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .jj
          - .threadbridge
          - .cargo-home
          - target
          - build
          - dist
          - manga-translator-gtk/target
          - manga-translator-gpui/target
          - manga-translator-core/target
