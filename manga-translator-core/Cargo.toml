[package]
name = "manga-translator-core"
version = "0.2.2"
edition = "2024"
description = "Manga Image Translator — shared core (config + Python IPC bridge)"
license = "MIT"

[dependencies]
gettext-rs = { version = "0.8", features = ["gettext-system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
dirs = "7"
base64 = "0.23"
hotpath = "0.29"

[features]
default = []
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
