[package]
name = "xattr"
version = "0.2.3"
edition = "2021"
description = "Compatibility shim forwarding to xattr 1.x"
license = "MIT"

# Why this exists:
#
# gpui 0.2.2 -> gpui_http_client -> zed-async-tar -> xattr 0.2.3, which does
# `pub const ENOATTR: libc::c_int = libc::ENOATTR;` on Linux. libc >= 0.2.183
# dropped that constant, and rustix/nix in the same dependency graph require
# libc ^0.2.182, so the graph cannot be pinned to a libc that still has it.
#
# zed-async-tar only calls `xattr::set`, so forwarding to xattr 1.x is a
# drop-in replacement. Remove this shim once a gpui release ships with
# zed-async-tar >= 0.6 (or any version not depending on xattr 0.2).
[dependencies]
xattr1 = { package = "xattr", version = "1" }
